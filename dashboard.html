<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>📊 Dashboard Interacciones CPSL</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin:0; font-family:'Inter',Arial,sans-serif; background:linear-gradient(135deg, #0d0d1a 0%, #1a1a33 100%);
            color:#e0e0ff; min-height:100vh; display:flex; flex-direction:column;
        }
        header { padding:1rem; text-align:center; background:#111133; box-shadow:0 2px 8px rgba(0,0,0,0.4); }
        h1 { margin:0; font-weight:300; }
        .container { flex:1; padding:1rem; max-width:1200px; margin:auto; overflow:auto; }
        table { width:100%; border-collapse:collapse; background:#222244; border-radius:8px; overflow:hidden; }
        th, td { padding:0.75rem; text-align:left; }
        th { background:#111133; cursor:pointer; }
        tr:nth-child(even) { background:#2a2a44; }
        tr:hover { background:#3a3a66; }
        input[type="text"] { padding:0.5rem; border:none; border-radius:4px; margin-right:0.5rem; }
        button { padding:0.5rem 1rem; border:none; border-radius:4px; background:#4a90e2; color:#fff; cursor:pointer; }
        button:hover { background:#357ABD; }
        footer { text-align:center; padding:0.5rem; font-size:0.85rem; background:#111133; }
    </style>
</head>
<body>
    <header>
        <h1>📊 Dashboard Interacciones – CPSL Lima</h1>
        <div>
            <input type="date" id="dateFilter" />
            <button onclick="loadData()">Filtrar</button>
        </div>
    </header>
    <div class="container">
        <table id="tbl">
            <thead>
                <tr>
                    <th>Fecha/Hora</th>
                    <th>Teléfono</th>
                    <th>Tipo</th>
                    <th>Mensaje</th>
                    <th>Respuesta IA</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <footer>© 2026 Crear Poder Sin Límites – Todos los derechos reservados</footer>
    <script>
        async function loadData(){
            const date = document.getElementById('dateFilter').value;
            let url = '/api/interactions';
            if(date) url += `?date=${date}`;
            const r = await fetch(url);
            const data = await r.json();
            const tbody = document.querySelector('#tbl tbody');
            tbody.innerHTML='';
            if(!data.ok){ tbody.innerHTML='<tr><td colspan="5">Sin datos</td></tr>'; return; }
            data.interacciones.forEach(item=>{
                const tr=document.createElement('tr');
                tr.innerHTML=`<td>${item.ts||''}</td><td>${item.tel||''}</td><td>${item.tipo||''}</td><td>${item.msg||''}</td><td>${item.resp||''}</td>`;
                tbody.appendChild(tr);
            });
        }
        // Carga inicial
        loadData();
    </script>
</body>
</html>
