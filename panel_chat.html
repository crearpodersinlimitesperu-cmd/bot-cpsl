<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Torre de Control — CPSL Lima</title>
<style>
:root{--bg:#0f0f11;--bg2:#18181c;--bg3:#222228;--bg4:#2a2a32;--border:#2e2e38;--border2:#3a3a46;--txt:#f0f0f4;--txt2:#9090a0;--txt3:#606070;--green:#1db97a;--green2:#0f6e46;--green3:#0a3d27;--red:#e24b4a;--red3:#3d1515;--orange:#ef9f27;--orange3:#3d2a0a;--blue:#378add;--blue3:#0c2a40;--purple:#8b7cf8;--r:8px;--r2:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:13px}
.topbar{display:flex;align-items:center;gap:12px;padding:0 16px;height:44px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.topbar-brand{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--green);text-transform:uppercase}
.topbar-ver{font-size:10px;color:var(--txt3);margin-left:4px}
.topbar-spacer{flex:1}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--txt3);flex-shrink:0}
.status-dot.online{background:var(--green);box-shadow:0 0 6px var(--green)}
.status-txt{font-size:11px;color:var(--txt2)}
.badge-live{background:var(--green3);color:var(--green);font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;border:1px solid var(--green2);letter-spacing:.06em}
.layout{display:flex;flex:1;overflow:hidden}
.sidebar{width:300px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--bg2)}
.search-wrap{padding:10px 12px;border-bottom:1px solid var(--border)}
.search-wrap input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:7px 10px;color:var(--txt);font-size:12px;outline:none}
.search-wrap input:focus{border-color:var(--blue)}
.tabs{display:flex;padding:6px 8px;gap:4px;border-bottom:1px solid var(--border)}
.tab{flex:1;text-align:center;padding:5px 4px;border-radius:6px;font-size:10px;font-weight:600;cursor:pointer;color:var(--txt3);letter-spacing:.04em;text-transform:uppercase;transition:all .15s}
.tab:hover{background:var(--bg3);color:var(--txt2)}
.tab.active{background:var(--bg4);color:var(--txt)}
.tab.active.t-der{color:var(--orange)}
.tab.active.t-imo{color:var(--purple)}
.tab.active.t-px{color:var(--blue)}
.stats-bar{display:flex;padding:8px 12px;gap:6px;border-bottom:1px solid var(--border)}
.stat{flex:1;text-align:center;background:var(--bg3);border-radius:6px;padding:6px 4px}
.stat-n{font-size:16px;font-weight:700;line-height:1}
.stat-l{font-size:9px;color:var(--txt3);margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
.stat-n.unread{color:var(--orange)}
.stat-n.derivados{color:var(--red)}
.conv-list{flex:1;overflow-y:auto;padding:6px}
.conv-list::-webkit-scrollbar{width:4px}
.conv-list::-webkit-scrollbar-track{background:transparent}
.conv-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.conv-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r);cursor:pointer;margin-bottom:2px;transition:background .12s;position:relative}
.conv-item:hover{background:var(--bg3)}
.conv-item.active{background:var(--bg4)}
.conv-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;position:relative}
.conv-avatar.imo{background:#2a2350;color:var(--purple)}
.conv-avatar.px{background:#0c2236;color:var(--blue)}
.conv-avatar.nuevo{background:#1a2a1a;color:var(--green)}
.conv-avatar.ext{background:var(--bg3);color:var(--txt3)}
.conv-avatar.cc{background:#1a3020;color:var(--green)}
.tipo-badge{position:absolute;bottom:-2px;right:-2px;font-size:7px;font-weight:800;padding:1px 3px;border-radius:3px;text-transform:uppercase;letter-spacing:.03em}
.tipo-badge.imo{background:var(--purple);color:#fff}
.tipo-badge.px{background:var(--blue);color:#fff}
.tipo-badge.der{background:var(--orange);color:#000}
.tipo-badge.ok{background:var(--green);color:#000}
.conv-body{flex:1;min-width:0}
.conv-nombre{font-size:12px;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-nombre .cc-tag{font-size:9px;color:var(--orange);margin-left:4px;font-weight:700}
.conv-preview{font-size:11px;color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.conv-preview.der{color:var(--orange)}
.conv-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.conv-hora{font-size:10px;color:var(--txt3)}
.conv-unread{background:var(--orange);color:#000;font-size:9px;font-weight:800;padding:1px 5px;border-radius:8px;min-width:16px;text-align:center}
.conv-der-badge{background:var(--orange3);color:var(--orange);font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;border:1px solid var(--orange)}
.chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.chat-header{padding:12px 16px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;gap:10px;flex-shrink:0;min-height:52px}
.chat-header-name{font-size:14px;font-weight:700}
.chat-header-info{font-size:11px;color:var(--txt3)}
.chat-header-cc{font-size:11px;color:var(--orange);margin-left:6px;font-weight:600}
.chat-tel{font-size:10px;color:var(--txt3);margin-top:1px}
.chat-header-spacer{flex:1}
.btn-der-badge{background:var(--orange3);color:var(--orange);border:1px solid var(--orange);padding:4px 10px;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer}
.chat-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.chat-msgs::-webkit-scrollbar{width:4px}
.chat-msgs::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.msg-wrap{display:flex;flex-direction:column;max-width:70%}
.msg-wrap.out{align-self:flex-end;align-items:flex-end}
.msg-wrap.in{align-self:flex-start}
.msg-bubble{padding:8px 12px;border-radius:10px;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg-bubble.out{background:var(--green3);color:var(--txt);border-bottom-right-radius:2px}
.msg-bubble.in{background:var(--bg3);color:var(--txt);border-bottom-left-radius:2px}
.msg-hora{font-size:9px;color:var(--txt3);margin-top:2px;padding:0 2px}
.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--txt3);gap:8px}
.chat-empty-icon{font-size:32px;opacity:.3}
.chat-input-wrap{padding:10px 12px;border-top:1px solid var(--border);background:var(--bg2);display:flex;gap:8px}
.chat-input{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:8px 12px;color:var(--txt);font-size:12px;outline:none;resize:none;max-height:80px}
.chat-input:focus{border-color:var(--green)}
.btn-send{background:var(--green2);color:var(--green);border:none;border-radius:var(--r);padding:8px 14px;cursor:pointer;font-size:12px;font-weight:700;transition:all .15s}
.btn-send:hover{background:var(--green);color:#000}
.right-panel{width:240px;flex-shrink:0;border-left:1px solid var(--border);background:var(--bg2);display:flex;flex-direction:column;overflow-y:auto;padding:12px}
.right-panel::-webkit-scrollbar{width:4px}
.right-panel::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.rp-section{margin-bottom:16px}
.rp-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--txt3);margin-bottom:8px}
.cc-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--r);background:var(--bg3);margin-bottom:4px}
.cc-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.cc-nombre{font-size:11px;font-weight:600;flex:1}
.cc-count{font-size:10px;font-weight:700;color:var(--orange);background:var(--orange3);padding:1px 6px;border-radius:10px}
.cc-count.zero{color:var(--txt3);background:var(--bg4)}
.seg-mode{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:6px 8px;color:var(--txt);font-size:11px;margin-bottom:6px;outline:none}
.btn-row{display:flex;gap:5px;margin-bottom:4px}
.btn-seg{flex:1;padding:6px;border-radius:var(--r);font-size:10px;font-weight:700;cursor:pointer;border:1px solid var(--border2);background:var(--bg3);color:var(--txt2);transition:all .15s}
.btn-seg:hover{background:var(--bg4);color:var(--txt)}
.btn-seg.primary{background:var(--green2);color:var(--green);border-color:var(--green2)}
.btn-seg.primary:hover{background:var(--green);color:#000}
.btn-seg.warn{color:var(--orange)}
.btn-seg.danger{color:var(--red)}
.seg-status{font-size:10px;color:var(--txt3);padding:4px 0;min-height:16px}
.seg-status.running{color:var(--green)}
.new-chat-btn{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:8px;color:var(--txt2);font-size:11px;cursor:pointer;text-align:left;transition:all .15s;margin-top:auto}
.new-chat-btn:hover{background:var(--bg4);color:var(--txt)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg4);border:1px solid var(--border2);color:var(--txt);padding:8px 16px;border-radius:var(--r);font-size:12px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.toast.ok{border-color:var(--green);color:var(--green)}
.toast.err{border-color:var(--red);color:var(--red)}
</style>
</head>
<body>
<div class="topbar"><span class="topbar-brand">⚡ Torre de Control</span><span class="topbar-ver">CPSL Lima — V110</span><div class="topbar-spacer"></div><div class="status-dot" id="statusDot"></div><span class="status-txt" id="statusTxt">Conectando...</span><span class="badge-live" id="liveBadge" style="display:none">LIVE</span></div>
<div class="layout">
  <div class="sidebar">
    <div class="search-wrap"><input type="text" id="searchInput" placeholder="Buscar nombre o teléfono..." oninput="renderLista()"></div>
    <div class="tabs"><div class="tab active" data-tab="todos" onclick="setTab('todos',this)">Todos</div><div class="tab t-imo" data-tab="imo" onclick="setTab('imo',this)">IMO</div><div class="tab t-px" data-tab="px" onclick="setTab('px',this)">PX</div><div class="tab t-der" data-tab="der" onclick="setTab('der',this)">Derivados</div><div class="tab" data-tab="nuevo" onclick="setTab('nuevo',this)">Nuevos</div></div>
    <div class="stats-bar"><div class="stat"><div class="stat-n" id="sTotal">0</div><div class="stat-l">Total</div></div><div class="stat"><div class="stat-n unread" id="sUnread">0</div><div class="stat-l">No leídos</div></div><div class="stat"><div class="stat-n derivados" id="sDer">0</div><div class="stat-l">Derivados</div></div></div>
    <div class="conv-list" id="convList"></div>
    <button class="new-chat-btn" onclick="abrirNuevoChat
