<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torre de Control V108 - Crear Poder</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; --whatsapp-in: #202c33; --whatsapp-out: #005c4b; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1200px; height: 90vh; display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        
        /* Lateral: Equipo y Simulador */
        .sidebar { background: var(--card); border-radius: 12px; padding: 20px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 20px; }
        .stat-card { background: var(--bg); padding: 15px; border-radius: 8px; border-left: 4px solid var(--accent); }
        .stat-card h4 { margin: 0; color: var(--accent); font-size: 14px; }
        .stat-card p { margin: 5px 0 0; font-weight: bold; font-size: 20px; }

        /* Principal: Ventana tipo WhatsApp */
        .main-panel { background: var(--card); border-radius: 12px; display: flex; flex-direction: column; border: 1px solid #334155; overflow: hidden; }
        .chat-header { background: #1e293b; padding: 15px 25px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .chat-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-blend-mode: overlay; background-color: #0b141a; }
        
        /* Burbujas de Chat */
        .bubble { max-width: 70%; padding: 10px 15px; border-radius: 8px; font-size: 14px; position: relative; line-height: 1.5; }
        .bubble.in { align-self: flex-start; background: var(--whatsapp-in); border-bottom-left-radius: 0; }
        .bubble.out { align-self: flex-end; background: var(--whatsapp-out); border-bottom-right-radius: 0; }
        .bubble .meta { font-size: 10px; color: #94a3b8; margin-top: 5px; display: block; text-align: right; }
        .bubble .sender { font-weight: bold; color: var(--accent); font-size: 12px; display: block; margin-bottom: 3px; }

        /* Controles */
        .controls { padding: 15px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 10px; }
        input { flex: 1; background: #2a3942; border: none; padding: 12px; border-radius: 8px; color: white; outline: none; }
        button { background: var(--accent); color: #0f172a; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2 style="color: var(--accent); margin: 0;">Sede Lima V108</h2>
            <div id="staff-stats">
                <div class="stat-card"><h4>Diana (C1/C2)</h4><p id="count-dmoscoso">0</p></div>
                <div class="stat-card"><h4>Joyce (C1/C2)</h4><p id="count-jmarin">0</p></div>
                <div class="stat-card"><h4>Zuley (C1/C2)</h4><p id="count-zurteaga">0</p></div>
                <div class="stat-card"><h4>Leyla (MJ)</h4><p id="count-lpasquel">0</p></div>
            </div>
            <hr style="border: 0; border-top: 1px solid #334155; width: 100%;">
            <div class="stat-card" style="border-color: #10b981;">
                <h4>Última Identidad Detectada</h4>
                <p id="last-dni" style="font-size: 14px; color: #10b981;">Esperando DNI...</p>
            </div>
            <button onclick="location.reload()" style="background: #334155; color: white; margin-top: auto;">🔄 Refrescar Sistema</button>
        </aside>

        <main class="main-panel">
            <div class="chat-header">
                <div>
                    <strong id="current-chat-name">Monitor Global de Mensajes</strong><br>
                    <small style="color: #94a3b8;">En línea - Torre de Control Quantum</small>
                </div>
                <div style="font-size: 12px; color: var(--accent);">V108.2 MASTER</div>
            </div>
            <div class="chat-area" id="chat-box">
                </div>
            <div class="controls">
                <input type="text" placeholder="Simular mensaje de nuevo prospecto...">
                <button>Nuevo Chat</button>
            </div>
        </main>
    </div>

    <script>
        async function updateDashboard() {
            try {
                const response = await fetch('/api/historial');
                const messages = await response.json();
                const chatBox = document.getElementById('chat-box');
                
                // Si hay nuevos mensajes, actualizamos
                if (chatBox.dataset.lastCount !== messages.length.toString()) {
                    chatBox.innerHTML = messages.map(msg => `
                        <div class="bubble ${msg.tipo === 'in' ? 'in' : 'out'}">
                            <span class="sender">${msg.nombre}</span>
                            ${msg.texto.replace(/\n/g, '<br>')}
                            <span class="meta">${msg.hora}</span>
                        </div>
                    `).join('');
                    chatBox.dataset.lastCount = messages.length;
                    chatBox.scrollTop = chatBox.scrollHeight;

                    // Actualizar DNI en la barra lateral
                    const lastClientMsg = [...messages].reverse().find(m => m.tipo === 'in');
                    if (lastClientMsg && lastClientMsg.nombre.includes('-')) {
                        document.getElementById('last-dni').innerText = lastClientMsg.nombre;
                    }
                }
            } catch (e) { console.error("Error cargando monitor:", e); }
        }

        setInterval(updateDashboard, 2000);
        updateDashboard();
    </script>
</body>
</html>
